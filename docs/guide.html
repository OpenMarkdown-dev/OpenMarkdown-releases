<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide — moved to Docs — OpenMarkdown</title>
  <meta name="description" content="The OpenMarkdown guide is now the docs: openmarkdown.dev/docs.">
  <link rel="canonical" href="https://openmarkdown.dev/docs/">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17171A">
  <!-- /guide moved to /docs (spec: landing-page / 指南页 guide.html; design D9).
       The script sends each old anchor to the page that now holds it; without
       JS the refresh goes to /docs/ and the link below is there to click. -->
  <script>
    (function () {
      var to = {
        '#watch': '/docs/#see-it-in-action',
        '#syntax': '/docs/reference/markdown/',
        '#shortcuts': '/docs/reference/shortcuts/',
        '#cli': '/docs/reference/cli/',
        '#languages': '/docs/using/themes-language/'
      }[location.hash] || '/docs/';
      location.replace(to);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/docs/">
  <link rel="icon" type="image/svg+xml" href="assets/06-appicon-ink.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>

  <!-- BEGIN site-nav (generated — do not edit) -->
  <nav class="nav" id="nav">
    <div class="wrap">
      <a class="brand" href="/">
        <img class="mark-rev" src="assets/02-mark-reversed.svg" alt="" width="34" height="21">
        <img class="mark-pri" src="assets/01-mark-primary.svg" alt="" width="34" height="21">
        OpenMarkdown
      </a>
      <div class="links">
        <a href="/demo" id="navDemo">Demo</a>
        <a href="/support">Pricing</a>
        <a href="/docs/">Docs</a>
        <a href="https://github.com/OpenMarkdown-dev/OpenMarkdown-releases">GitHub</a>
        <a class="btn" href="/#download">Download</a>
      </div>
    </div>
  </nav>
  <!-- The nav's Demo entry is the SECOND way into the demo; the hero button is the
       first. They sit on the same page, so nothing downstream — referrer, landing
       path — can tell them apart, and one shared event would permanently lose
       which entry actually works. So they count separately, the way /support's two
       CTAs already do (contract: landing-page-analytics / demo 入口计为意图事件).
       Lives here rather than in each page's own script block because the nav is on
       every page: the alternative is fourteen copies of this listener, which is
       the thing this file exists to prevent. Attaches only — no request is made
       here, and none at all off the production host, where window.goatcounter is
       never defined. -->
  <script>
    (function () {
      var link = document.getElementById('navDemo');
      if (!link) return;
      link.addEventListener('click', function () {
        var gc = window.goatcounter;
        if (gc && gc.count) gc.count({ path: 'try-demo-nav', event: true });
      });
    })();
  </script>
  <!-- END site-nav -->

  <main class="wrap">
    <header class="guide-hero">
      <h1>The guide is now the docs</h1>
      <p class="lede">Syntax, shortcuts, the CLI and everything else live at <a href="/docs/">openmarkdown.dev/docs</a>.</p>
    </header>
  </main>

  <!-- BEGIN site-footer (generated — do not edit) -->
  <div class="seam" aria-hidden="true"></div>
  <footer class="site-footer">
    <div class="wrap">
      <div class="foot-row">
        <span>OpenMarkdown — Open .md with OpenMarkdown.</span>
        <span class="fnav">
          <a href="/faq">FAQ</a>
          <a href="/compare/">Compare</a>
          <a href="https://github.com/OpenMarkdown-dev/OpenMarkdown-releases/releases">Releases</a>
          <a href="https://github.com/OpenMarkdown-dev/OpenMarkdown-releases">GitHub</a>
          <a href="/transparency">Transparency</a>
        </span>
      </div>
    </div>
  </footer>
  <!-- END site-footer -->
</body>
</html>
